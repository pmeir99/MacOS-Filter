name: Build and test MacOS Filter

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        required: false
        type: string
      race_id:
        description: Parent build race identifier
        required: false
        type: string
      runner_label:
        description: Compatible macOS runner to try
        required: false
        type: choice
        options:
          - macos-26
          - macos-15
          - macos-latest


permissions:
  actions: write
  contents: write

concurrency:
  group: ${{ startsWith(github.ref_name, 'macos-filter-races/') && format('macos-filter-candidate-{0}', github.run_id) || format('macos-filter-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  dispatch-race:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      race_id: ${{ steps.race.outputs.race_id }}
      branch: ${{ steps.race.outputs.branch }}
      winner_run: ${{ steps.winner.outputs.run_id }}
    steps:
      - name: Dispatch compatible macOS runners
        id: race
        uses: actions/github-script@v8
        with:
          script: |
            const raceId = String(context.runId) + "-" + process.env.GITHUB_RUN_ATTEMPT;
            const branch = "macos-filter-races/" + raceId;
            const labels = ["macos-26", "macos-15", "macos-latest"];

            const oldRuns = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "build.yml",
              event: "workflow_dispatch",
              per_page: 100
            });
            for (const run of oldRuns.data.workflow_runs) {
              if (!run.head_branch.startsWith("macos-filter-races/")) continue;
              if (["completed", "cancelled", "failure"].includes(run.status)) continue;
              try {
                await github.rest.actions.cancelWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id
                });
              } catch (error) {
                if (error.status !== 404 && error.status !== 409) throw error;
              }
            }

            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: "refs/heads/" + branch,
              sha: context.sha
            });
            core.setOutput("race_id", raceId);
            core.setOutput("branch", branch);

            await Promise.all(labels.map(runner_label =>
              github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "build.yml",
                ref: branch,
                inputs: { race_id: raceId, runner_label, version: "0.4." + process.env.GITHUB_RUN_NUMBER }
              })
            ));
            core.info("Dispatched " + labels.length + " compatible macOS runner candidates.");

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Exercise filtering in Chromium
        run: |
          python3 -m venv "$RUNNER_TEMP/mf-browser"
          "$RUNNER_TEMP/mf-browser/bin/pip" install --quiet pillow playwright==1.55.0
          "$RUNNER_TEMP/mf-browser/bin/playwright" install chromium
          "$RUNNER_TEMP/mf-browser/bin/python" scripts/browser-smoke.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Layout-comparison
          path: layout-comparison/*.png
          if-no-files-found: ignore

      - name: Wait for the runner that wins and builds
        id: winner
        uses: actions/github-script@v8
        env:
          SOURCE_BRANCH: ${{ steps.race.outputs.branch }}
        with:
          retries: 3
          script: |
            const branch = process.env.SOURCE_BRANCH;
            for (let attempt = 0; attempt < 300; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "build.yml",
                branch,
                event: "workflow_dispatch",
                per_page: 100
              });
              for (const winner of data.workflow_runs.filter(run => run.conclusion === "success")) {
                const {data: artifacts} = await github.rest.actions.listWorkflowRunArtifacts({...context.repo, run_id: winner.id});
                if (!artifacts.artifacts.some(artifact => artifact.name === "MacOS-Filter-Bundle")) continue;
                core.setOutput("run_id", String(winner.id));
                core.info("Winning runner build: workflow run " + winner.id + ".");
                return;
              }
              const terminal = ["completed", "cancelled", "failure", "timed_out", "action_required"];
              if (data.workflow_runs.length >= 3 &&
                  data.workflow_runs.every(run => terminal.includes(run.status))) {
                throw new Error("Every macOS runner candidate ended without a successful build.");
              }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw new Error("No compatible runner completed the build within 50 minutes.");

      - name: Download verified application
        uses: actions/download-artifact@v4
        with:
          name: MacOS-Filter-Bundle
          run-id: ${{ steps.winner.outputs.run_id }}
          github-token: ${{ github.token }}
          path: release

      - name: Publish verified application to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.4.${{ github.run_number }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release view "$TAG" --json assets --jq '.assets[].digest' | grep -Fx "sha256:$(sha256sum release/MacOS-Filter-macOS.zip | cut -d' ' -f1)"
          else
            gh release create "$TAG" release/MacOS-Filter-macOS.zip --target "$GITHUB_SHA" --title "MacOS Filter ${TAG#v}" --generate-notes --latest
          fi

      - name: Remove temporary race refs
        if: always() && steps.race.outputs.race_id != ''
        uses: actions/github-script@v8
        env:
          RACE_ID: ${{ steps.race.outputs.race_id }}
        with:
          script: |
            for (const ref of [
              "heads/macos-filter-races/" + process.env.RACE_ID,
              "tags/macos-filter-claim-" + process.env.RACE_ID
            ]) {
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref
                });
              } catch (error) {
                if (error.status !== 404 && error.status !== 422) throw error;
              }
            }

  claim-test-package:
    if: startsWith(github.ref_name, 'macos-filter-races/') && inputs.race_id != ''
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 40
    steps:
      - name: Atomically claim the race and cancel losing runners
        id: claim
        uses: actions/github-script@v8
        env:
          RACE_ID: ${{ inputs.race_id }}
        with:
          script: |
            const raceId = process.env.RACE_ID;
            const ref = "refs/tags/macos-filter-claim-" + raceId;
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref,
                sha: context.sha
              });
              core.setOutput("winner", "true");
            } catch (error) {
              if (error.status !== 422 && error.status !== 409) throw error;
              core.setOutput("winner", "false");
              core.info("Another compatible runner claimed the build first.");
              return;
            }

            const branch = context.ref.replace(/^refs\/heads\//, "");
            const cancelled = new Set();
            for (let attempt = 0; attempt < 40 && cancelled.size < 2; attempt++) {
              const {data} = await github.rest.actions.listWorkflowRuns({
                ...context.repo, workflow_id: "build.yml", branch, per_page: 10
              });
              await Promise.all(data.workflow_runs.filter(run => run.id !== context.runId && !cancelled.has(run.id)).map(async run => {
                if (run.status !== "completed") {
                  try { await github.rest.actions.cancelWorkflowRun({...context.repo, run_id: run.id}); }
                  catch (error) { if (![404,409].includes(error.status)) throw error; }
                }
                cancelled.add(run.id);
              }));
              if (cancelled.size < 2) await new Promise(resolve => setTimeout(resolve, 500));
            }

      - name: Stop this losing candidate
        if: steps.claim.outputs.winner != 'true'
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.actions.cancelWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId
            });

      - name: Check out source
        if: steps.claim.outputs.winner == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        if: steps.claim.outputs.winner == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check extension syntax and run extension tests
        if: steps.claim.outputs.winner == 'true'
        run: |
          set -euo pipefail
          npm --prefix extension run check
          npm --prefix extension test

      - name: Run Swift tests with warnings as errors
        if: steps.claim.outputs.winner == 'true'
        run: swift test -Xswiftc -warnings-as-errors

      - uses: actions/setup-python@v5
        if: steps.claim.outputs.winner == 'true'
        with:
          python-version: '3.11'
          architecture: arm64

      - name: Build and package macOS app and extension
        if: steps.claim.outputs.winner == 'true'
        env:
          FILTER_VERSION: ${{ inputs.version }}
        run: bash scripts/package-app.sh

      - name: Verify packaged outputs
        if: steps.claim.outputs.winner == 'true'
        run: |
          set -euo pipefail
          test -d "dist/MacOS Filter.app"
          test -x "dist/MacOS Filter.app/Contents/MacOS/MacOSFilter"
          test -x "dist/MacOS Filter.app/Contents/MacOS/FilterHost"
          test -f "dist/MacOS Filter.app/Contents/Resources/Extension/manifest.json"
          unzip -t dist/MacOS-Filter-macOS.zip

      - name: Upload verified app and extension
        if: steps.claim.outputs.winner == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MacOS-Filter-Bundle
          path: |
            dist/MacOS-Filter-macOS.zip
          if-no-files-found: error
          retention-days: 30
